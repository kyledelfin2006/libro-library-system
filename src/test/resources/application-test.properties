# Test profile: activated with @ActiveProfiles("test") on every Spring test.
# This file is layered ON TOP of src/main/resources/application.properties, so tests run with the real
# production defaults (probes, rate limits, error handling). Override only what a test run cannot supply.

# Deterministic test-only signing key (32 bytes). Production requires LIBRO_JWT_SECRET_BASE64.
libro.security.jwt.secret-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# Test-only BCrypt value required by the historical V2 Flyway bootstrap migration in PostgreSQL tests.
spring.flyway.placeholders.adminPasswordHash=$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy

# Keep Actuator on its own port as in production, but let the OS pick it so parallel test contexts never collide.
management.server.port=0
