# This file shadows src/main/resources/application.properties during tests.
# Keep the test-only JWT key and the required rate-limit settings aligned with production keys.
# Deterministic test-only signing key; production requires LIBRO_JWT_SECRET_BASE64.
libro.security.jwt.issuer=libro-api
libro.security.jwt.audience=libro-api
libro.security.jwt.secret-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
libro.security.jwt.access-token-ttl-seconds=900
# Mirrors the production login request default (20 requests).
libro.security.rate-limit.login.requests=20
# Mirrors the production login window default (60 seconds).
libro.security.rate-limit.login.window-seconds=60
# Mirrors the production signup request default (10 requests).
libro.security.rate-limit.signup.requests=10
# Mirrors the production signup window default (3600 seconds).
libro.security.rate-limit.signup.window-seconds=3600
# Mirrors the production tracked client-route default (10000 keys).
libro.security.rate-limit.max-tracked-client-routes=10000
# Test-only BCrypt value required by the historical V2 Flyway bootstrap migration in PostgreSQL tests.
spring.flyway.placeholders.adminPasswordHash=$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy
