# PostgreSQL connection (values from environment, the .env file)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Schema managed via Flyway only (no Hibernate auto-DDL)
# Hibernate verifies that the existing database schema matches  Java entity mappings during  startup
spring.jpa.hibernate.ddl-auto=validate

# Let GlobalExceptionHandler handle 404s as JSON
spring.mvc.throw-exception-if-no-handler-found=true

# Required to prevent default welcome page from masking 404s
spring.web.resources.add-mappings=false

# Limits max pagination size to 100 for preventing DoS attacks.
spring.data.web.pageable.max-page-size=100

# Disable Spring Boot's built-in SQL initialization
spring.sql.init.mode=never

# Set to true despite auto-config, for explicit certainty
spring.flyway.enabled=true

# Set flyway location to classpath for explicit certainty
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.adminPasswordHash=${LIBRO_ADMIN_PASSWORD_HASH:}

# JWT signing material must be supplied by the runtime environment or secret manager.
libro.security.jwt.issuer=${LIBRO_JWT_ISSUER:libro-api}
libro.security.jwt.audience=${LIBRO_JWT_AUDIENCE:libro-api}
libro.security.jwt.secret-base64=${LIBRO_JWT_SECRET_BASE64}
libro.security.jwt.access-token-ttl-seconds=${LIBRO_JWT_ACCESS_TOKEN_TTL_SECONDS:900}

# Public endpoint limits are per client IP and per application instance.
libro.security.rate-limit.login.requests=${LIBRO_LOGIN_RATE_LIMIT_REQUESTS:20}
libro.security.rate-limit.login.window-seconds=${LIBRO_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
libro.security.rate-limit.signup.requests=${LIBRO_SIGNUP_RATE_LIMIT_REQUESTS:10}
libro.security.rate-limit.signup.window-seconds=${LIBRO_SIGNUP_RATE_LIMIT_WINDOW_SECONDS:3600}
libro.security.rate-limit.max-tracked-client-routes=${LIBRO_RATE_LIMIT_MAX_TRACKED_CLIENT_ROUTES:10000}

# Release the database connection when the service method returns, not after the response is written.
# Lazy relations must be read inside service transactions (mappers already run there).
spring.jpa.open-in-view=false

# Let in-flight requests finish during rolling restarts, within the per-phase timeout below.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Connection pool size per instance; keep below PostgreSQL max_connections divided by instance count.
spring.datasource.hikari.maximum-pool-size=${LIBRO_DB_POOL_SIZE:10}

# Never include exception messages or stack traces in Boot's fallback error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# This JSON API accepts no file uploads; cap form bodies and disable multipart parsing.
server.tomcat.max-http-form-post-size=1MB
spring.servlet.multipart.enabled=false

# Expose only Actuator health over HTTP; other management endpoints remain unexposed.
management.endpoints.web.exposure.include=health
# Enable liveness and readiness groups for load balancer and container probes.
management.endpoint.health.probes.enabled=true
# Readiness must fail while PostgreSQL is unreachable (the default group only tracks application state).
# Liveness deliberately excludes the database so a database outage does not restart healthy containers.
management.endpoint.health.group.readiness.include=readinessState,db
# Hide database and component details from unauthenticated health responses.
management.endpoint.health.show-details=never

# Accept Forwarded/X-Forwarded-* headers only with native Tomcat handling behind a trusted proxy.
# Allowed values are none or native; default none. Use native only when direct app-port access is blocked.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# Comma-separated exact HTTP(S) UI origins; `*` is rejected and blank is the default (no cross-origin browser requests).
libro.security.cors.allowed-origins=${LIBRO_CORS_ALLOWED_ORIGINS:}

# Optional first-librarian provisioning is disabled when all five values are blank; set every value together.
# Optional LIBRO_BOOTSTRAP_LIBRARIAN_UNIVERSITY_ID; allowed format is 0000-0000, default blank disables provisioning.
libro.bootstrap.librarian.university-id=${LIBRO_BOOTSTRAP_LIBRARIAN_UNIVERSITY_ID:}
# Optional LIBRO_BOOTSTRAP_LIBRARIAN_EMAIL; valid email up to 150 characters, default blank disables provisioning.
libro.bootstrap.librarian.email=${LIBRO_BOOTSTRAP_LIBRARIAN_EMAIL:}
# Optional LIBRO_BOOTSTRAP_LIBRARIAN_FIRST_NAME; nonblank and up to 50 characters when used; default blank disables provisioning.
libro.bootstrap.librarian.first-name=${LIBRO_BOOTSTRAP_LIBRARIAN_FIRST_NAME:}
# Optional LIBRO_BOOTSTRAP_LIBRARIAN_LAST_NAME; nonblank and up to 50 characters when used; default blank disables provisioning.
libro.bootstrap.librarian.last-name=${LIBRO_BOOTSTRAP_LIBRARIAN_LAST_NAME:}
# Optional LIBRO_BOOTSTRAP_LIBRARIAN_PASSWORD_HASH; valid BCrypt hash only (never plaintext), default blank disables provisioning.
libro.bootstrap.librarian.password-hash=${LIBRO_BOOTSTRAP_LIBRARIAN_PASSWORD_HASH:}

# Public OpenAPI document (/v3/api-docs) and Swagger UI (/swagger-ui.html). Default true so UI developers can
# browse the contract without a token; set LIBRO_API_DOCS_ENABLED=false to remove both routes in production.
libro.api-docs.enabled=${LIBRO_API_DOCS_ENABLED:true}
springdoc.api-docs.enabled=${libro.api-docs.enabled}
springdoc.swagger-ui.enabled=${libro.api-docs.enabled}

# Include the correlation ID (set by RequestIdFilter) in every log line.
logging.pattern.level=%5p [%X{requestId:-}]
# Quiet framework noise by default; override with LOGGING_LEVEL_APP=DEBUG while investigating.
logging.level.root=INFO
logging.level.app=${LOGGING_LEVEL_APP:INFO}
