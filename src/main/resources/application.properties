# PostgreSQL connection (values from environment, the .env file)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Schema managed via Flyway only (no Hibernate auto-DDL)
# Hibernate verifies that the existing database schema matches  Java entity mappings during  startup
spring.jpa.hibernate.ddl-auto=validate

# Let GlobalExceptionHandler handle 404s as JSON
spring.mvc.throw-exception-if-no-handler-found=true

# Required to prevent default welcome page from masking 404s
spring.web.resources.add-mappings=false

# Limits max pagination size to 100 for preventing DoS attacks.
spring.data.web.pageable.max-page-size=100

# Disable Spring Boot's built-in SQL initialization
spring.sql.init.mode=never

# Set to true despite auto-config, for explicit certainty
spring.flyway.enabled=true

# Set flyway location to classpath for explicit certainty
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.adminPasswordHash=${LIBRO_ADMIN_PASSWORD_HASH}

# JWT signing material must be supplied by the runtime environment or secret manager.
libro.security.jwt.issuer=${LIBRO_JWT_ISSUER:libro-api}
libro.security.jwt.audience=${LIBRO_JWT_AUDIENCE:libro-api}
libro.security.jwt.secret-base64=${LIBRO_JWT_SECRET_BASE64}
libro.security.jwt.access-token-ttl-seconds=${LIBRO_JWT_ACCESS_TOKEN_TTL_SECONDS:900}
