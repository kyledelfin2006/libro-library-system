# CD for the Libro Library API (GitHub Actions). Extends CI; it does not replace it.
#
#   image   after CI passes on main: build ONE linux/arm64 image, scan it, publish it to GitHub Container Registry
#           tagged with the commit SHA, and output its immutable digest
#   ui      build the web UI (ui/dist) from the same commit, with the generated release history, and keep it as a
#           workflow artifact. The API image does not contain the UI; Caddy serves it from ui/dist on the host.
#   deploy  (only when enabled and approved) SSH to the production VM, run scripts/deploy.sh with the image digest,
#           then install the built UI with scripts/install-ui.sh. The server never rebuilds the release, so what was
#           scanned and built here is exactly what runs.
#
# Pull requests that change this workflow, the Dockerfile, the scan script, or the UI install script run `image` and
# `ui` without publishing or deploying, so edits to the release path are exercised before they reach main.
#
# One-time setup (the `production` environment, its secrets, and deployment enable variable): docs/devops/runbook.md.
name: CD

on:
  # Release path: fires when the CI workflow finishes on main (success is checked in the job's `if`).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual release of the current main; still gated by the `production` environment.
  workflow_dispatch:
  # Dry run of the release path itself.
  pull_request:
    paths:
      - .github/workflows/cd.yml
      - Dockerfile
      - scripts/ci/trivy-scan.sh
      - scripts/install-ui.sh
      - ui/scripts/build-release-history.mjs

# Read-only by default; each job asks for exactly what it needs.
permissions:
  contents: read

jobs:
  image:
    name: image
    # workflow_run fires for failed CI runs too, and for CI runs started by events other than a push to main.
    # Release only after a successful CI run on a push.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Native ARM64 runner (free for public repositories): no slow QEMU emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # Only this job may push to GitHub Container Registry.
    outputs:
      image: ${{ steps.publish.outputs.image }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      # The commit CI validated: workflow_run's head SHA, or the triggering commit for manual and PR runs.
      # Building `main` instead could pick up a newer, not-yet-validated commit.
      - name: Resolve revision
        id: revision
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false # The job never pushes to git, so do not leave a token in .git/config.
      # Container image labels: `source` links the GHCR package to this repository; `revision` records the exact commit.
      - name: Build image
        run: |
          docker build --platform linux/arm64 \
            --build-arg "LIBRO_COMMIT=${{ steps.revision.outputs.sha }}" \
            --build-arg "LIBRO_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}" \
            -t libro-api:release .
      # Same policy as CI's security-scan job, applied to the exact image that would be published.
      - name: Scan image
        run: scripts/ci/trivy-scan.sh image libro-api:release
      - name: Publish image
        id: publish
        if: github.event_name != 'pull_request' # PR dry runs stop after the scan.
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.revision.outputs.sha }}
        run: |
          # GHCR requires lowercase names; ${VAR,,} is bash's lowercase expansion.
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/libro-api"
          # --password-stdin keeps the token out of the process list and the shell history.
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag libro-api:release "$repo:$SHA"
          docker push "$repo:$SHA"
          # After a push, RepoDigests holds "name@sha256:...": the immutable reference deploy.sh requires.
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:$SHA")"
          echo "Published $digest"
          echo "image=$digest" >> "$GITHUB_OUTPUT"

  ui:
    name: ui
    # Same release condition as `image`: only a successful CI run on a push, a manual run, or a PR dry run.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Also lets the release-history script read GitHub Releases.
      actions: read # And the successful CD runs listed on the Release history page.
    defaults:
      run:
        working-directory: ui
    steps:
      # The commit CI validated, for the same reason as the image job: never a newer, unvalidated main.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Best effort: a GitHub outage writes an empty history; it never fails the release.
      - name: Generate release history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:history
      - name: Build
        run: npm run build
      # One tarball so the deploy job moves a single file and the server unpacks it atomically (install-ui.sh).
      - name: Package
        run: tar -C dist -czf "$RUNNER_TEMP/libro-ui.tgz" .
      - name: Upload UI build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libro-ui
          path: ${{ runner.temp }}/libro-ui.tgz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: deploy
    needs: [image, ui]
    # Off until the repository deployment-enable variable is 'true'. The `production` environment's required
    # reviewers then hold the job until someone approves it.
    if: >-
      github.event_name != 'pull_request'
      && vars.OCI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read # Deploying needs no registry or token permissions.
    # Never run two deployments at once, and never cancel one that is already changing the server.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Download UI build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: libro-ui
          path: ${{ runner.temp }}/ui
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.OCI_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_USER }}
          SHA: ${{ needs.image.outputs.sha }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          # 1. Validate inputs before they reach a remote shell: a full 40-character commit SHA and a
          #    digest-pinned GHCR reference. Anything else stops the job.
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected revision"; exit 1; }
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || { echo "unexpected image reference"; exit 1; }

          # 2. Write the deploy key with owner-only permissions (ssh refuses keys that others can read).
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 3. Pin the server's host key from a secret. StrictHostKeyChecking=yes below makes the connection
          #    fail if the server presents any other key, which blocks a man-in-the-middle.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          # 4. Run a short script on the VM. `bash -s -- "$SHA" "$IMAGE"` reads the script from stdin (the
          #    heredoc) and passes the two values as $1 and $2. The quoted 'REMOTE' delimiter stops the runner
          #    expanding anything inside, so the values arrive only as arguments, never as code.
          #    The VM checkout moves to the validated commit (so scripts and Compose files match the image),
          #    then deploy.sh backs up, starts the image, smoke-tests it, and rolls back on failure.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$HOST" 'bash -s' -- "$SHA" "$IMAGE" <<'REMOTE'
          set -euo pipefail
          cd /opt/libro
          git fetch --quiet origin
          git checkout --quiet --detach "$1"
          scripts/deploy.sh --image "$2"
          REMOTE

      # The API is healthy and smoke-tested at this point (deploy.sh rolls back and fails otherwise). The UI goes
      # in afterwards so a rolled-back release never leaves a newer UI in front of an older API. The proxy serves
      # ui/dist straight from the bind mount, so no container restart is needed.
      - name: Install web UI
        env:
          HOST: ${{ secrets.OCI_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_USER }}
        run: |
          # Reuses the key and pinned host key written by the previous step on this runner. The tarball is
          # streamed on stdin; install-ui.sh checks for index.html and updates ui/dist in place.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$HOST" 'cd /opt/libro && scripts/install-ui.sh' < "$RUNNER_TEMP/ui/libro-ui.tgz"
