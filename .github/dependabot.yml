# Dependabot opens weekly pull requests for outdated dependencies so security releases are not missed.
# Spring Boot-managed libraries should be updated by raising the parent version in pom.xml, not individually.
# Not covered (update by hand when the related Dependabot PR lands):
#   - the Trivy image digest in scripts/ci/trivy-scan.sh
#   - the PostgreSQL digest in src/test/java/app/support/PostgresTestConfig.java (keep it equal to docker-compose.yml)
version: 2
updates:
  # Maven dependencies and plugins declared in pom.xml.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Base images referenced by the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Images referenced by docker-compose.yml (PostgreSQL, Caddy). These are pinned by digest, so updates arrive as PRs.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  # Actions used by .github/workflows (pinned by commit SHA; Dependabot updates the SHA and version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
