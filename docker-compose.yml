# Quick start from the repository root:
#   Copy-Item .env.example .env   (PowerShell)
#   docker compose up --build      (Docker builds the application from source)
# Docker Compose reads variables from the root .env file automatically.
# Fill the required values before starting. Public-route limits have defaults and can be tuned in `.env`.
# Rotate container logs so a long-running host cannot fill its disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL stores the library data. Its named volume survives container
  # recreation and ordinary `docker compose down`; removing it with
  # `docker compose down -v` permanently deletes the local database contents.
  db:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395 # Official PostgreSQL image pinned by digest; keep its major version intentional.
    container_name: library-postgres
    environment:
      # Compose substitutes these values from .env. Use local development
      # credentials here and keep the .env file out of source control.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Lets tools on this computer connect to PostgreSQL at localhost:5432.
      # Bound to loopback so other hosts on the network cannot reach the database.
      # The app container connects over Compose's private network using `db:5432`.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql as its data-volume root.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # `healthy` means PostgreSQL accepts connections with the configured DB/user.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Cap memory so a runaway query cannot starve the API on a small host.
    mem_limit: 512m
    logging: *default-logging
    # Restart after a crash or Docker daemon restart; `docker compose down` still stops it.
    restart: unless-stopped

  # Spring Boot REST API. The multi-stage Dockerfile compiles and packages the application.
  app:
    build: . # Repository root is the build context and contains the Dockerfile.
    container_name: library-app
    depends_on:
      db:
        # Avoid starting Spring before PostgreSQL is ready to accept connections.
        condition: service_healthy
    environment:
      # Inside the Compose network, `db` is the database service hostname.
      # Do not use localhost here: localhost would point back to this app container.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Flyway V2 uses this BCrypt hash when creating the historical bootstrap
      # administrator in a fresh database. Required only for the first startup of an empty database;
      # a blank value on a fresh database makes the migration fail fast.
      LIBRO_ADMIN_PASSWORD_HASH: ${LIBRO_ADMIN_PASSWORD_HASH:-}
      # A random Base64 secret (at least 32 decoded bytes) is required to issue/validate JWTs.
      LIBRO_JWT_SECRET_BASE64: ${LIBRO_JWT_SECRET_BASE64}
      LIBRO_JWT_ISSUER: ${LIBRO_JWT_ISSUER:-libro-api}
      LIBRO_JWT_AUDIENCE: ${LIBRO_JWT_AUDIENCE:-libro-api}
      LIBRO_JWT_ACCESS_TOKEN_TTL_SECONDS: ${LIBRO_JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      # Public Swagger UI/OpenAPI routes; off unless LIBRO_API_DOCS_ENABLED=true is set in .env.
      LIBRO_API_DOCS_ENABLED: ${LIBRO_API_DOCS_ENABLED:-false}
      # Exact comma-separated UI origins; blank default allows none. Set only the deployed browser UI origins.
      LIBRO_CORS_ALLOWED_ORIGINS: ${LIBRO_CORS_ALLOWED_ORIGINS:-}
      # Allowed values none/native; default none. Use native only when the app port is reachable solely from the trusted proxy.
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
      LIBRO_LOGIN_RATE_LIMIT_REQUESTS: ${LIBRO_LOGIN_RATE_LIMIT_REQUESTS:-20}
      LIBRO_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LIBRO_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LIBRO_SIGNUP_RATE_LIMIT_REQUESTS: ${LIBRO_SIGNUP_RATE_LIMIT_REQUESTS:-10}
      LIBRO_SIGNUP_RATE_LIMIT_WINDOW_SECONDS: ${LIBRO_SIGNUP_RATE_LIMIT_WINDOW_SECONDS:-3600}
      LIBRO_RATE_LIMIT_MAX_TRACKED_CLIENT_ROUTES: ${LIBRO_RATE_LIMIT_MAX_TRACKED_CLIENT_ROUTES:-10000}
      # Optional 0000-0000 ID; blank by default and requires the other four bootstrap values to be set together.
      LIBRO_BOOTSTRAP_LIBRARIAN_UNIVERSITY_ID: ${LIBRO_BOOTSTRAP_LIBRARIAN_UNIVERSITY_ID:-}
      # Optional valid email up to 150 characters; blank by default and required with the other four values.
      LIBRO_BOOTSTRAP_LIBRARIAN_EMAIL: ${LIBRO_BOOTSTRAP_LIBRARIAN_EMAIL:-}
      # Optional nonblank first name up to 50 characters; blank by default and required with the other four values.
      LIBRO_BOOTSTRAP_LIBRARIAN_FIRST_NAME: ${LIBRO_BOOTSTRAP_LIBRARIAN_FIRST_NAME:-}
      # Optional nonblank last name up to 50 characters; blank by default and required with the other four values.
      LIBRO_BOOTSTRAP_LIBRARIAN_LAST_NAME: ${LIBRO_BOOTSTRAP_LIBRARIAN_LAST_NAME:-}
      # Optional BCrypt hash only; blank by default, requires all other values, and never accepts plaintext.
      LIBRO_BOOTSTRAP_LIBRARIAN_PASSWORD_HASH: ${LIBRO_BOOTSTRAP_LIBRARIAN_PASSWORD_HASH:-}
    # Hardening: cap memory (JVM heap is 75% of this via MaxRAMPercentage; idle use measured near 365 MB) and block privilege escalation.
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    ports:
      # Open the API on this computer only at http://localhost:8080.
      # Remove the loopback prefix only when a trusted reverse proxy or firewall fronts the host.
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Probe public database readiness every 30s; allow 60s for migrations, then require success within 5s for three retries.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  # Optional TLS reverse proxy (`docker compose --profile proxy up`). It is the only service that listens on the
  # public interfaces; the app stays on loopback, so clients cannot bypass TLS or the proxy.
  # Set LIBRO_DOMAIN to your host name and SERVER_FORWARD_HEADERS_STRATEGY=native in .env when using it.
  proxy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    container_name: library-proxy
    profiles: ["proxy"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      LIBRO_DOMAIN: ${LIBRO_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persists issued certificates so restarts do not request new ones.
      - caddy_data:/data
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

volumes:
  # Compose creates and manages this persistent volume for PostgreSQL data.
  postgres_data:
  # TLS certificates issued by the proxy profile.
  caddy_data:
