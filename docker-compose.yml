# Local stack: PostgreSQL + the API, plus an optional Caddy TLS proxy.
#
# Quick start from the repository root:
#   cp .env.example .env            (PowerShell: Copy-Item .env.example .env), then fill the required values
#   docker compose up --build       builds the image from source and starts db + app
#   docker compose --profile proxy up --build   also starts the TLS proxy
#   docker compose --profile metrics up --build  also starts Prometheus and Grafana (loopback only)
#
# Compose reads .env automatically. Production layers infra/docker-compose.prod.yml on top of this file
# (scripts/deploy.sh does that for you).

# Rotate container logs so a long-running host cannot fill its disk. Reused by every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL stores the library data in a named volume. The volume survives `docker compose down`;
  # `docker compose down -v` deletes it permanently.
  db:
    # Official image pinned by digest; keep the major version intentional. Tests use the same digest
    # (src/test/java/app/support/PostgresTestConfig.java).
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    container_name: library-postgres
    environment:
      # `${VAR}` is substituted from .env when Compose reads this file.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Loopback only: tools on this computer can connect on localhost:5432, other hosts on the network cannot.
      # The app reaches the database over Compose's private network as `db:5432`.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql as its data-volume root.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # `$$` escapes `$` so the variables are expanded inside the container, not by Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: 512m
    logging: *default-logging
    # Restart after a crash or Docker daemon restart; `docker compose down` still stops it.
    restart: unless-stopped

  # Spring Boot REST API, built from the multi-stage Dockerfile in the repository root.
  # Its health check (/readyz) is defined once, in the Dockerfile.
  app:
    build: .
    container_name: library-app
    depends_on:
      db:
        # Start Spring only once PostgreSQL accepts connections.
        condition: service_healthy
    # List form, because it allows both `NAME=value` and bare `NAME` entries.
    environment:
      # --- Values this file derives or requires ------------------------------------------------------------
      # `db` is the database service's host name on the Compose network (localhost would be this container).
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # `:?` stops Compose with this message instead of starting an app that cannot sign tokens.
      - LIBRO_JWT_SECRET_BASE64=${LIBRO_JWT_SECRET_BASE64:?set LIBRO_JWT_SECRET_BASE64 in .env (openssl rand -base64 32)}

      # --- Optional settings, passed through only when set -------------------------------------------------
      # A bare name copies the variable from .env (or the shell) into the container. If it is not set at all,
      # it is left out, and the default in src/main/resources/application.properties applies. That file is
      # the single place defaults live; .env.example documents each one.
      - LIBRO_ADMIN_PASSWORD_HASH
      - LIBRO_JWT_ISSUER
      - LIBRO_JWT_AUDIENCE
      - LIBRO_JWT_ACCESS_TOKEN_TTL_SECONDS
      - LIBRO_API_DOCS_ENABLED
      - LIBRO_ENVIRONMENT_NAME
      - LIBRO_CORS_ALLOWED_ORIGINS
      - SERVER_FORWARD_HEADERS_STRATEGY
      - LIBRO_LOGIN_RATE_LIMIT_REQUESTS
      - LIBRO_LOGIN_RATE_LIMIT_WINDOW_SECONDS
      - LIBRO_SIGNUP_RATE_LIMIT_REQUESTS
      - LIBRO_SIGNUP_RATE_LIMIT_WINDOW_SECONDS
      - LIBRO_RATE_LIMIT_MAX_TRACKED_CLIENT_ROUTES
      - LIBRO_DB_POOL_SIZE
      - LOGGING_LEVEL_APP
      - LIBRO_BOOTSTRAP_LIBRARIAN_UNIVERSITY_ID
      - LIBRO_BOOTSTRAP_LIBRARIAN_EMAIL
      - LIBRO_BOOTSTRAP_LIBRARIAN_FIRST_NAME
      - LIBRO_BOOTSTRAP_LIBRARIAN_LAST_NAME
      - LIBRO_BOOTSTRAP_LIBRARIAN_PASSWORD_HASH
    # Memory cap: the JVM heap is 75% of this (MaxRAMPercentage in the Dockerfile); idle use is about 365 MB.
    mem_limit: 1g
    security_opt:
      # The process can never gain more privileges than it started with (for example via setuid binaries).
      - no-new-privileges:true
    ports:
      # Loopback only: http://localhost:8080 on this computer. The management port (9091) is never published.
      - "127.0.0.1:8080:8080"
    logging: *default-logging
    restart: unless-stopped

  # Optional TLS reverse proxy: `docker compose --profile proxy up`. It is the only service listening on public
  # interfaces; the app stays on loopback, so clients cannot bypass TLS or the proxy.
  # When using it, set LIBRO_DOMAIN and SERVER_FORWARD_HEADERS_STRATEGY=native in .env.
  proxy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    container_name: library-proxy
    profiles: ["proxy"]
    depends_on:
      app:
        # Uses the Dockerfile's HEALTHCHECK, so the proxy only starts once /readyz answers.
        condition: service_healthy
    environment:
      LIBRO_DOMAIN: ${LIBRO_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The static UI build (`cd ui && npm ci && npm run build`). Without it the proxy still serves the API.
      - ./ui/dist:/srv/ui:ro
      # Persists issued certificates so restarts do not request new ones.
      - caddy_data:/data
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  # Optional metrics: `docker compose --profile metrics up`. Prometheus scrapes the API's private management port
  # (app:9091, never published) and Grafana shows the provisioned dashboard. Both listen on loopback only; reach them
  # from another machine through an SSH tunnel. Grafana has no admin user and allows anonymous read-only viewing
  # (GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION), so there is no password to manage and nothing to change in the UI.
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    container_name: library-prometheus
    profiles: ["metrics"]
    depends_on:
      app:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    container_name: library-grafana
    profiles: ["metrics"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/metrics/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  prometheus_data:
  grafana_data:
